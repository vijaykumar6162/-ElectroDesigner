<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElectroVolt Diagram Studio</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>

<!-- ================= HEADER ================= -->

<header class="topbar">

    <div class="logo">

        <div class="logo-icon">
            ⚡
        </div>

        <div class="logo-text">
            <h2>ElectroVoltKWh</h2>
            <p>Electrical Diagram Editor</p>
        </div>

    </div>

    <div class="toolbar">

        <button><i class="fa-regular fa-file"></i><span>New</span></button>

        <button><i class="fa-regular fa-folder-open"></i><span>Open</span></button>

        <button><i class="fa-regular fa-floppy-disk"></i><span>Save</span></button>

        <button><i class="fa-solid fa-file-export"></i><span>Export</span></button>

        <button><i class="fa-solid fa-print"></i><span>Print</span></button>

        <button><i class="fa-solid fa-rotate-left"></i><span>Undo</span></button>

        <button><i class="fa-solid fa-rotate-right"></i><span>Redo</span></button>

        <button><i class="fa-solid fa-magnifying-glass-plus"></i><span>Zoom In</span></button>

        <button><i class="fa-solid fa-magnifying-glass-minus"></i><span>Zoom Out</span></button>

        <button><i class="fa-solid fa-table-cells-large"></i><span>Grid</span></button>

        <button><i class="fa-solid fa-magnet"></i><span>Snap</span></button>

        <button><i class="fa-solid fa-moon"></i><span>Theme</span></button>

    </div>

</header>

<!-- ================= MAIN ================= -->

<div class="main-layout">

    <!-- LEFT SIDEBAR -->

    <aside class="sidebar">

        <h3>Electrical Symbols</h3>

        <input
        type="text"
        placeholder="Search Symbol...">

        <div class="symbol-category">

            <h4>Power Source</h4>

            <div class="symbol-grid">

                <div class="symbol" draggable="true" data-symbol="pole">
    <img src="assets/symbols/pole.svg" alt="Pole">

    <span>Pole</span>

</div>

                <div class="symbol">Transformer</div>

                <div class="symbol">Generator</div>

                <div class="symbol">Meter</div>

            </div>

        </div>

        <div class="symbol-category">

            <h4>Protection</h4>

            <div class="symbol-grid">

                <div class="symbol">MCB</div>

                <div class="symbol">RCCB</div>

                <div class="symbol">MCCB</div>

                <div class="symbol">Isolator</div>

            </div>

        </div>

        <div class="symbol-category">

            <h4>Loads</h4>

            <div class="symbol-grid">

                <div class="symbol">Lamp</div>

                <div class="symbol">Fan</div>

                <div class="symbol">Socket</div>

                <div class="symbol">Motor</div>

            </div>

        </div>

    </aside>

    <!-- CENTER CANVAS -->

    <main class="canvas-area">

        <div class="canvas-header">

            Untitled Diagram

        </div>

        <div id="drawingCanvas">

            Canvas Area

        </div>

    </main>

    <!-- RIGHT PROPERTY PANEL -->

    <aside class="properties">

        <h3>Properties</h3>

        <hr>

        <p>No Element Selected</p>

        <br>

        <label>Background</label>

        <input type="color">

        <br><br>

        <label>Grid</label>

        <input type="checkbox" checked>

        <br><br>

        <label>Snap</label>

        <input type="checkbox" checked>

        <br><br>

        <label>Grid Size</label>

        <select>

            <option>10</option>

            <option>20</option>

            <option>30</option>

            <option>40</option>

        </select>

    </aside>

</div>

<!-- ================= STATUS BAR ================= -->

<footer class="statusbar">

    <div>

        X : 0

        &nbsp;&nbsp;

        Y : 0

    </div>

    <div>

        Zoom : 100%

    </div>

</footer>

<!-- JS -->

<script src="js/app.js"></script>

<script src="js/canvas.js"></script>

<script src="js/toolbar.js"></script>

<script src="js/symbols.js"></script>

<script src="js/wire.js"></script>

<script src="js/export.js"></script>

<script src="js/save.js"></script>

<script src="js/undo.js"></script>

</body>
</html>
